version: 1

sources:
  - id: notre-dame-football-media
    name: Notre Dame Football Media Information
    categories: [official_game_notes, official_depth_charts]
    publisher: Notre Dame Athletics
    authority: official
    scope: { kind: team, id: notre-dame }
    access: public
    links:
      - label: Football media hub
        url: https://fightingirish.com/ndfbmedia
    guidance: >-
      Open the current-season football media table and follow the game-note, opponent-note,
      depth-chart, postgame-note, or gamebook link for the matchup being researched.
    limitations:
      - Team-produced depth charts and availability notes can change after publication.

  - id: virginia-football-media-center
    name: Virginia Football Media Center
    categories: [official_game_notes, official_depth_charts]
    publisher: Virginia Athletics
    authority: official
    scope: { kind: team, id: virginia }
    access: public
    links:
      - label: Football media center
        url: https://virginiasports.com/virginia-football-media-center
    guidance: >-
      Use the current-season matchup rows for Virginia notes, opponent notes, ACC notes, and
      depth-chart links.
    limitations:
      - Team-produced depth charts are projected lineups, not confirmed snap assignments.

  - id: georgia-tech-football-media
    name: Georgia Tech Football Media Resources
    categories: [official_game_notes, official_depth_charts]
    publisher: Georgia Tech Athletics
    authority: official
    scope: { kind: team, id: georgia-tech }
    access: public
    links:
      - label: Football archive
        url: https://ramblinwreck.com/football-archive
    guidance: >-
      Use the season sections for game notes and depth charts; ignore schedules, recruiting,
      statistics-only pages, and general news.
    limitations:
      - The archive may link to a season-specific media page after navigation.

  - id: clemson-football-media
    name: Clemson Football Media Information
    categories: [official_game_notes]
    publisher: Clemson Athletics
    authority: official
    scope: { kind: team, id: clemson }
    access: public
    links:
      - label: Football media links
        url: https://clemsontigers.com/football-links
    guidance: >-
      Use the media-resources and game-by-game notes sections for current matchup packets.
    limitations:
      - Media guides and spring guides on the same page are slower-moving background sources.

  - id: michigan-football-game-notes
    name: Michigan Football Game Notes
    categories: [official_game_notes]
    publisher: Michigan Athletics
    authority: official
    scope: { kind: team, id: michigan }
    access: public
    links:
      - label: Football archive
        url: https://mgoblue.com/sports/2017/6/16/football-archive
    guidance: >-
      Select the current season and follow only official football game-note links for the target
      matchup.
    limitations:
      - The archive also contains historical material and unrelated football resources.

  - id: acc-football-availability
    name: ACC Football Student-Athlete Availability Reporting
    categories: [official_availability_reports]
    publisher: Atlantic Coast Conference
    authority: official
    scope: { kind: conference, id: acc }
    access: public_client_rendered
    links:
      - label: Current football reports
        url: https://theacc.com/sports/2025/8/28/availability-reporting-football.aspx
      - label: Availability policy and status definitions
        url: https://theacc.com/sports/2025/8/28/availability-reporting.aspx
    guidance: >-
      When the table is populated for the current season, pull the latest conference-game report
      and use the policy page to interpret Available, Probable, Questionable, Out, and Game Time
      Decision.
    limitations:
      - Covers conference games and began with the 2025 season.
      - The current report table requires client-side rendering.
      - Do not treat a prior-season table as current availability.

  - id: sec-football-availability
    name: SEC Football Student-Athlete Availability Reports
    categories: [official_availability_reports]
    publisher: Southeastern Conference
    authority: official
    scope: { kind: conference, id: sec }
    access: public_client_rendered
    links:
      - label: Current football reports
        url: https://www.secsports.com/fbreports
      - label: Report archive
        url: https://www.secsports.com/fbreports-archive
    guidance: >-
      Use the latest timestamped matchup report during the reporting window and consult the archive
      only for prior games.
    limitations:
      - Report cards and archive contents require client-side rendering.
      - Recheck late updates because player designations can change before kickoff.

  - id: big12-football-availability
    name: Big 12 Football Player Availability Reporting
    categories: [official_availability_reports]
    publisher: Big 12 Conference
    authority: official
    scope: { kind: conference, id: big-12 }
    access: public_client_rendered
    links:
      - label: Football availability reports
        url: https://big12sports.com/sports/2025/8/14/FBreporting.aspx
    guidance: >-
      When the page is populated for the current season, use it for the newest conference-game
      player designations.
    limitations:
      - The route is season-dated; verify whether the conference publishes a replacement each year.
      - Report contents require client-side rendering.
      - Do not treat a prior-season table as current availability.

  - id: game-on-paper-player-usage
    name: Game on Paper CFB Player Usage
    categories: [player_usage]
    publisher: Game on Paper
    authority: independent
    scope: { kind: national }
    access: public
    links:
      - label: College football hub
        url: https://gameonpaper.com/cfb
      - label: Passing usage
        url: https://gameonpaper.com/cfb/players/passing
      - label: Rushing usage
        url: https://gameonpaper.com/cfb/players/rushing
      - label: Receiving usage
        url: https://gameonpaper.com/cfb/players/receiving
      - label: Metric glossary
        url: https://gameonpaper.com/cfb/glossary
    guidance: >-
      Select the intended season, then use player and team pages for dropbacks, carries, targets,
      catches, yards, EPA, and success rate. Derive workload shares against the corresponding team
      totals when useful.
    limitations:
      - These are recorded-play usage measures, not offense, defense, or special-teams snaps.
      - Receiving targets and target-based metrics can be incomplete when the play record does not
        identify the intended receiver.
      - Data come from cfbfastR and can differ from ESPN because of availability or quality.
      - National leaderboards apply minimum-volume thresholds; use team pages for smaller roles.

  - id: cfbstats-player-usage
    name: cfbstats.com Player Statistics
    categories: [player_usage]
    publisher: cfbstats.com
    authority: independent
    scope: { kind: national }
    access: public
    links:
      - label: College football statistics
        url: https://cfbstats.com
    guidance: >-
      Enter the intended season and team roster, then use public player game logs, splits, and
      situational pages for attempts, receptions, returns, tackles, and other observable workload.
    limitations:
      - The public pages do not provide literal snap counts, routes, or receiving targets.
      - A field named Plays is category-specific workload and must not be interpreted as snaps.
      - Bulk downloadable packages advertised by the site are commercial; use only ordinary public
        web pages.

  - id: ncaa-fbs-player-statistics
    name: NCAA FBS Individual Statistics
    categories: [player_usage]
    publisher: NCAA
    authority: official
    scope: { kind: national }
    access: public
    links:
      - label: Current FBS statistics
        url: https://www.ncaa.com/stats/football/fbs
    guidance: >-
      Use the individual-statistic category tables to confirm official games played, passing and
      rushing attempts, receptions, returns, tackles, and other standard production.
    limitations:
      - These are national category tables, not complete player snap-count tables.
      - Some views show only qualifying leaders and omit low-volume players.

