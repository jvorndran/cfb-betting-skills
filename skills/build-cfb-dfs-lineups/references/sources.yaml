    authority: independent
    scope: { kind: national }
    access: public
    links:
      - label: Author page
        url: https://sports.yahoo.com/author/ross-dellenger/
    guidance: >-
      Use current bylines for national college-football news, governance, conference policy,
      realignment, playoff developments, and reported personnel movement.
    limitations:
