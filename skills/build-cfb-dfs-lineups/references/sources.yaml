    categories: [beat_reporting]
    publisher: Eleven Warriors
    authority: independent
    scope: { kind: team, id: ohio-state }
    access: public
    links:
      - label: Ohio State football coverage
        url: https://www.elevenwarriors.com/ohio-state-football
    guidance: >-
      Use staff-bylined coverage for practices, depth, player roles, injuries, roster movement,
      press conferences, matchups, and snap-count reporting.
