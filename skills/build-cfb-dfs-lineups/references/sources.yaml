      - Separate reported articles from columns and opinion.

  - id: daily-texan-football-beat
    name: The Daily Texan Football Beat
    categories: [beat_reporting]
    publisher: The Daily Texan
    authority: independent
    scope: { kind: team, id: texas }
    access: public
    links:
      - label: Texas football beat
        url: https://thedailytexan.com/category/sports/football
    guidance: >-
      Use staff-bylined reporting for practices, player roles, roster and transfer changes,
      injuries, coaching comments, and matchup preparation.
    limitations:
      - Student assignments rotate; use the stable beat page instead of one writer's page.
      - Separate reported articles from commentary and predictions.

  - id: cbs-sports-college-football-play-by-play
    name: CBS Sports College Football GameTracker
    categories: [play_by_play]
    publisher: CBS Sports
    authority: independent
    scope: { kind: national }
    access: public
    links:
      - label: College football scoreboard
        url: https://www.cbssports.com/college-football/scoreboard/
    guidance: >-
      Select the target game, open GameTracker, and use Plays or Full Play By Play for clock, down
      and distance, play descriptions, scoring events, and drive context.
    limitations:
      - GameTracker coverage varies; verify that the target game has a complete play log.
      - This is a public research webpage, not a documented API or redistribution license.
      - Play descriptions can be corrected after the live event.

  - id: on3-football-transfer-portal-wire
    name: On3 College Football Transfer Portal Wire
    categories: [transactions, transfer_portal]
    publisher: On3
    authority: independent
    scope: { kind: national }
    access: public
    links:
      - label: Current football transfer wire
        url: https://www.on3.com/transfer-portal/wire/football
    guidance: >-
      Use the current-season wire for player-level portal movement, recording the displayed status,
      date, previous school, and destination. Corroborate consequential moves with an official team
      announcement.
    limitations:
      - On3 is a secondary tracker, not the non-public NCAA transfer portal, so records can lag.
      - Filter to FBS players and schools; the wire includes programs outside the subdivision.
      - Expected destinations and prediction percentages are not completed transactions.
      - Coverage is transfer movement, not every dismissal, retirement, or draft departure.
