      - Anonymous article access was verified on 2026-08-04; recheck periodically.

  - id: michigan-daily-football-beat
    name: The Michigan Daily Football Beat
    categories: [beat_reporting]
    publisher: The Michigan Daily
    authority: independent
    scope: { kind: team, id: michigan }
    access: public
    links:
      - label: Michigan football beat
        url: https://www.michigandaily.com/sports/football/
    guidance: >-
      Use staff-bylined reporting from practices, press conferences, games, roster developments,
      injuries, depth, and player-role stories.
    limitations:
