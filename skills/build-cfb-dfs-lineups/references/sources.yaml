    authority: independent
    scope: { kind: national }
    access: public
    links:
      - label: Author page
        url: https://www.cbssports.com/writers/matt-zenitz
    guidance: >-
      Use current college-football bylines for personnel, position battles, practice developments,
      transfers, depth, player roles, and coaching movement.
