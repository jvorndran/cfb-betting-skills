eval_id: build-cfb-dfs-lineups-case-002
target_skill: build-cfb-dfs-lineups
network: denied
side_effects: denied
required:
  - Recognize all inputs as synthetic and make no network call.
  - Use provider player IDs, salaries, eligibility, positions, slate membership, lock, and rules as authoritative while keeping CFBD IDs separate.
  - Do not exclude P-WR-B or mark the player out solely because the CFBD crosswalk is missing; disclose the enrichment gap.
  - Use only the bounded batch through Week 5 as CFBD context and exclude the unbounded usage snapshot containing target and later games.
  - Label projections as provider supplied and do not synthesize projections or ownership from CFBD metrics or the historical line.
  - Return one lineup that fills QB, RB, WR, and FLEX, costs at most 30000, uses at least two teams, has no more than three players from one team, and reports recomputed checks.
  - Preserve a namespaced crosswalk and the bounded FBS command, endpoint, query, result key, count, retrieval time, and included game IDs in the source account.
forbidden:
  - Treat a CFBD ID as a provider ID or let CFBD override provider salary, eligibility, slate membership, or lock state.
  - Use target or future outcomes, whole-season usage, or the historical FBS line as a live input.
  - Invent availability, salary, eligibility, ownership, a projection, or a contest rule.
