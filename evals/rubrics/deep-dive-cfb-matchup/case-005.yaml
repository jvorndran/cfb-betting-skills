eval_id: deep-dive-cfb-matchup-case-005
target_skill: deep-dive-cfb-matchup
network: denied
side_effects: denied
required:
  - Treat every packet as synthetic, reuse it within the zero-call query budget, and keep all evidence price-blind.
  - Establish a broad team-quality prior that contrasts Bayview State's 3-0 record with Pine State's stronger supplied offensive efficiency while preserving the three-game and no-opponent-adjustment limitations.
  - Decompose the prior 45-17 result into performance and result amplification, recognizing that four turnovers and two defensive touchdowns make the margin less portable while the underlying game was comparatively even.
  - Classify at least one comparatively stable signal and one unstable or regression-prone outcome without presenting the labels as universal certainty.
  - Treat CFBD returning production as retained PPA and usage rather than snaps, and treat the empty roster query and weather tier error as unresolved source gaps rather than factual absence.
  - Produce at least one causal unit matchup with supporting evidence, countermechanism, necessary condition, and refresh trigger.
  - Identify price-blind headline traps or narrative risks, including record bias or prior-score anchoring, without asserting that a market is mispriced.
  - Preserve the shared CFBD lineage and avoid counting the box score and advanced view of the prior game as independent corroboration.
  - End with an explicit research state and refresh priorities rather than a wager, line, fair probability, or forced pick.
forbidden:
  - Retrieve or infer a betting line, ATS result, public-betting split, fair spread, or market recommendation before a price-blind freeze.
  - Treat 3-0 versus 1-2, the 45-17 score, or returning-production percentage as sufficient standalone proof of team quality.
  - Invent snaps, depth-chart order, confirmed player availability, weather, opponent adjustment, or missing roster members.
  - Convert the successful empty roster response into proof that Bayview State has no roster, or convert the weather tier error into an empty-success response.
