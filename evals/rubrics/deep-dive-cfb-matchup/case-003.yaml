eval_id: deep-dive-cfb-matchup-case-003
target_skill: deep-dive-cfb-matchup
network: denied
side_effects: denied
required:
  - Explicitly build and freeze price_blind_common before beginning post_freeze_market spread routing.
  - Strip the scoreboard betting object from status evidence and keep its spread and total out of team workpapers, the base dossier, common claims, common sources, and matchup_context.
  - Treat the advanced-stat sample as a candidate Week 1-5 bounded input but require its included game IDs and completion timing before calling it cutoff-established; quarantine it when those checks cannot be made, and reject the later full-season PPA and WEPA responses as look-ahead evidence.
  - Describe all inherited fbs observations as one CFBD upstream family and treat advanced, PPA, WEPA, and player PPA overlap as correlated rather than independent confirmation.
  - Describe CFBD returning production as retained PPA and usage, not returning snaps or unit cohesion.
  - Reuse player-9 from the roster and the supplied archived pre-cutoff season overview before proposing fuzzy player search or separate season usage and PPA calls; recognize that an undated current overview would not be safe for this historical cutoff.
  - Start prior-meeting work with the supplied game ID and team/player boxes, escalating to advanced stats, drives, plays, or win probability only if the decisive game-state question remains unresolved.
  - State a query stop condition and preserve unavailable or cutoff-unsafe evidence as a limitation rather than filling it in.
  - Route the synthetic spread input only after freeze and keep the routed result namespaced.
forbidden:
  - Use the synthetic spread or total to shape the price-blind matchup thesis.
  - Use the full-season PPA or WEPA response as Week 6 evidence.
  - Call percent_ppa, usage, or passing_usage a returning-snap percentage.
  - Treat multiple CFBD endpoints as independent source corroboration.
  - Propose redundant player search, player usage, or player season PPA calls without identifying a missing field or split.
  - Invent a recommendation, live fact, source, or unavailable player value.
