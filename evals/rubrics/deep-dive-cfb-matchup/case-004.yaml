eval_id: deep-dive-cfb-matchup-case-004
target_skill: deep-dive-cfb-matchup
network: denied
side_effects: denied
required:
  - Ask how the user wants the result visualized before beginning the dossier or creating a presentation.
  - Offer only feasible choices for the current host, including a concise chat report and a host-native interactive visualization or artifact only when that capability is available.
  - Make clear that the presentation choice does not change the evidence, provenance, or validation requirements.
  - Ask one concise presentation question rather than beginning research or requesting unrelated matchup details.
forbidden:
  - Assume a persistent repository report or other filesystem artifact when writes are unavailable.
  - Invent matchup facts, retrieve data, begin market analysis, or create a report before the presentation choice is supplied.
  - Ask downstream skills to prompt separately for the same presentation choice.
